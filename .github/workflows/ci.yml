name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # LVGL's headers let the tests compile every exported C file against the real API
      - run: git clone --depth 1 --branch v9.6.0 https://github.com/lvgl/lvgl.git runtime/lvgl
      - run: pnpm check
      # the house style is Prettier with the repo's config (pnpm format fixes it)
      - run: pnpm exec prettier --check .
      - run: pnpm build

  tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mkdir -p dist && cargo test --manifest-path src-tauri/Cargo.toml
